name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Build bundle
        run: bun run build
      - name: Ensure bundle is committed and up to date
        run: git diff --exit-code -- index.js || (echo "index.js is stale — run 'bun run build' and commit it" && exit 1)
